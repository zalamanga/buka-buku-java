<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:p="http://xmlns.jcp.org/jsf/passthrough" template="/WEB-INF/templates/base.xhtml">
<ui:define name="title">Daftar | BukaBuku</ui:define>
<ui:define name="content"><div class="auth-layout wrap">
  <div class="auth-art"><h:graphicImage library="image" name="bg.png" alt="Ilustrasi koleksi buku"/><p>Tambahkan bacaan ke katalog demo.</p></div>
  <section class="auth-form"><h1>Daftar akun demo</h1><p>Akun dapat menambah, mengubah, dan menghapus buku pada koleksi bersama. Gunakan data contoh, jangan data pribadi penting.</p>
    <h:messages styleClass="messages" role="alert"/>
    <h:form id="register"><input type="hidden" name="csrfToken" value="#{sessionScope.csrfToken}"/>
      <div class="field"><h:outputLabel for="name" value="Nama"/><h:inputText id="name" value="#{auth.name}" required="true" requiredMessage="Nama wajib diisi." p:autocomplete="name" p:maxlength="100"/></div>
      <div class="field"><h:outputLabel for="email" value="Email"/><h:inputText id="email" value="#{auth.email}" required="true" requiredMessage="Email wajib diisi." p:type="email" p:autocomplete="email" p:maxlength="254"/></div>
      <div class="field"><h:outputLabel for="password" value="Password"/><h:inputSecret id="password" value="#{auth.password}" required="true" requiredMessage="Password wajib diisi." p:autocomplete="new-password" p:maxlength="128" p:aria-describedby="password-help"/><small id="password-help">12 sampai 128 karakter.</small></div>
      <div class="field"><h:outputLabel for="confirmation" value="Ulangi password"/><h:inputSecret id="confirmation" value="#{auth.confirmation}" required="true" requiredMessage="Konfirmasi password wajib diisi." p:autocomplete="new-password" p:maxlength="128"/></div>
      <h:commandButton id="submit" value="Daftar akun" action="#{auth.register}" styleClass="button full"/><p class="submit-status" role="status" aria-live="polite"></p>
    </h:form>
    <p>Sudah terdaftar? <h:link outcome="/login" value="Masuk ke akun"/></p>
  </section>
</div></ui:define>
</ui:composition>
