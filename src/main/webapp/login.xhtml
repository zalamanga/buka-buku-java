<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:p="http://xmlns.jcp.org/jsf/passthrough" template="/WEB-INF/templates/base.xhtml">
<ui:define name="title">Masuk | BukaBuku</ui:define>
<ui:define name="content"><div class="auth-layout wrap">
  <div class="auth-art"><h:graphicImage library="image" name="bg.png" alt="Buku terbuka di samping lilin"/><p>Koleksi buku, dikelola bersama.</p></div>
  <section class="auth-form"><h1>Masuk ke BukaBuku</h1><p>Gunakan akun demo yang sudah kamu daftarkan.</p>
    <h:messages styleClass="messages" role="alert"/>
    <h:form id="login"><input type="hidden" name="csrfToken" value="#{sessionScope.csrfToken}"/>
      <div class="field"><h:outputLabel for="email" value="Email"/><h:inputText id="email" value="#{auth.email}" required="true" requiredMessage="Email wajib diisi." p:type="email" p:autocomplete="email" p:maxlength="254"/></div>
      <div class="field"><h:outputLabel for="password" value="Password"/><h:inputSecret id="password" value="#{auth.password}" required="true" requiredMessage="Password wajib diisi." p:autocomplete="current-password" p:maxlength="128"/></div>
      <h:commandButton id="submit" value="Masuk" action="#{auth.login}" styleClass="button full"/>
      <p class="submit-status" role="status" aria-live="polite"></p>
    </h:form>
    <p>Belum punya akun? <h:link outcome="/register" value="Daftar akun demo"/></p>
  </section>
</div></ui:define>
</ui:composition>
